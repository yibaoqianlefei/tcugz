<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>构造节点 · 模型封面渲染</title><style>
body{margin:0;padding:28px;background:#f6f7fa;color:#202946;font:15px/1.6 'Microsoft YaHei',sans-serif}h1{font-size:28px}button,input{font:inherit;padding:10px 16px;border:1px solid #bec8e0;border-radius:5px}button{background:#465993;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}input{width:420px;max-width:90%}.tools{display:flex;gap:12px;flex-wrap:wrap}#stage{margin:22px 0;background:#edf0f6;border-radius:8px;width:960px;max-width:100%;overflow:hidden}canvas{display:block;width:100%;height:auto}progress{width:500px;max-width:100%}#renders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}figure{margin:0;background:white;padding:12px}figure img{display:block;width:100%;background:#eef1f7}figcaption{font-size:12px}#errors{color:#b13725;white-space:pre-wrap}#status{font-weight:700;color:#465993}</style></head><body>
<h1>构造节点 · 真实 GLB 模型封面</h1><p>原模型材质、统一摄影棚光照、正交取景与透明背景。多方案节点使用首个方案作为封面。</p>
<div class="tools"><input id="filter" aria-label="节点 ID 筛选" placeholder="留空生成全部；多个 ID 用逗号分隔"><button id="render" disabled>准备渲染器</button><button id="finalize">验收并写入封面索引</button></div>
<p id="status" role="status" data-state="initializing">初始化</p><progress id="progress" value="0" max="93" aria-label="渲染进度"></progress><div id="stage"></div><pre id="errors"></pre><div id="renders"></div>
<script type="module" src="./renderer.mjs"></script></body></html>
