<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190" role="img" aria-labelledby="title desc"><title id="title">被动式太阳房墙体构造</title><desc id="desc">按原图保留玻璃、空气层、薄钢板、矿棉、墙体与孔口，未假定运行风向。</desc><metadata>{&quot;id&quot;:&quot;passive-solar-wall-01&quot;,&quot;title&quot;:&quot;被动式太阳房墙体构造&quot;,&quot;revision&quot;:&quot;wall-source-r3&quot;,&quot;createdOn&quot;:&quot;2026-10-30&quot;,&quot;source&quot;:{&quot;path&quot;:&quot;/images/wall/passive-solar-wall-diagram.png&quot;,&quot;width&quot;:607,&quot;height&quot;:370,&quot;format&quot;:&quot;png&quot;,&quot;sha256&quot;:&quot;b53dc9051faf32af1d8886117c1c9343281bf8a72932ce0da3ded6f41d9d50d4&quot;,&quot;smallRasterScreening&quot;:false},&quot;scope&quot;:&quot;按原图保留玻璃、空气层、薄钢板、矿棉、墙体与孔口，未假定运行风向。&quot;,&quot;parameters&quot;:[{&quot;value&quot;:&quot;玻璃3厚&quot;,&quot;kind&quot;:&quot;source-example&quot;},{&quot;value&quot;:&quot;空气层80厚&quot;,&quot;kind&quot;:&quot;source-example&quot;},{&quot;value&quot;:&quot;薄钢板0.5厚&quot;,&quot;kind&quot;:&quot;source-example&quot;},{&quot;value&quot;:&quot;矿棉30厚&quot;,&quot;kind&quot;:&quot;source-example&quot;},{&quot;value&quot;:&quot;孔口120×240（200×300）&quot;,&quot;kind&quot;:&quot;source-example&quot;},{&quot;value&quot;:&quot;局部标注80；右侧尺寸链120、120、120、275、120&quot;,&quot;kind&quot;:&quot;source-example&quot;}],&quot;geometryChecks&quot;:[&quot;上、下两个孔口均与空气间层及室内侧相接&quot;,&quot;矿棉和薄钢板在孔口及板端处中断&quot;,&quot;左侧80与右侧120板端厚度分开&quot;,&quot;实例厚度不代表适用于所有太阳房&quot;],&quot;knowledgeContext&quot;:{&quot;lessonKey&quot;:&quot;wall/wall-design-requirements&quot;,&quot;lessonTitle&quot;:&quot;墙体的设计要求&quot;,&quot;lessonPath&quot;:&quot;basics/wall/wall-design-requirements.html&quot;,&quot;figureId&quot;:&quot;model-wall-solar&quot;,&quot;knowledgeId&quot;:&quot;wall.solar&quot;,&quot;question&quot;:&quot;同一套玻璃、间层和孔口，为何不能在各季节采用同一运行方式？&quot;,&quot;principle&quot;:&quot;玻璃侧日射、间层空气、蓄热或传热界面与室内连接共同影响热交换。日照、室内外温度和孔口开闭变化，可能改变热量及空气流动方向。&quot;,&quot;task&quot;:&quot;从层次与孔口建立有条件的热交换路径。&quot;,&quot;objects&quot;:[&quot;外侧玻璃&quot;,&quot;空气间层&quot;,&quot;外围护墙&quot;,&quot;上部进风口&quot;,&quot;下部出风口&quot;],&quot;boundary&quot;:&quot;模型不模拟温度场、气流或季节切换，不把特殊太阳能墙直接当成普通外保温。&quot;,&quot;primary&quot;:true,&quot;relatedPrinciples&quot;:[],&quot;applications&quot;:[&quot;practice/envelope-detail&quot;]},&quot;references&quot;:[{&quot;standard&quot;:&quot;GB/T 50001—2017 房屋建筑制图统一标准&quot;,&quot;clause&quot;:&quot;7.3.1～7.3.3、9.1.1～9.1.4&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-45613.htm&quot;,&quot;materialUrl&quot;:&quot;https://gf.cabr-fire.com/m/article-45652.htm&quot;,&quot;statusUrl&quot;:&quot;https://ebook.chinabuilding.com.cn/zbooklib/bookpdf/probation?SiteID=1&amp;bookID=102879&quot;,&quot;checkedOn&quot;:&quot;2026-10-30&quot;,&quot;verification&quot;:&quot;读取规范原文中的引出线及图例表达规则；材料图例疏密按阅读尺寸调整，数字图幅不冒充打印比例。&quot;},{&quot;standard&quot;:&quot;JGJ/T 267—2012 被动式太阳能建筑技术规范&quot;,&quot;clause&quot;:&quot;4.4、4.6、6.2（范围及相关原文定位）&quot;,&quot;url&quot;:&quot;https://ebook.chinabuilding.com.cn/zbooklib/book/detail/show?SiteID=1&amp;bookID=57523&quot;,&quot;textSource&quot;:&quot;https://pro5323b5d3-pic11.ysjianzhan.cn/upload/2JGJ-T267-2012BDSTYNJZJSGF.pdf&quot;,&quot;checkedOn&quot;:&quot;2026-10-30&quot;,&quot;verification&quot;:&quot;出版目录与标准扫描件章节已定位；原图厚度和孔口为实例，不由本图推定集热量、全年气密或玻璃安全性能。&quot;}],&quot;geometryDigests&quot;:{&quot;solar-section&quot;:&quot;497964e76fb3374298583cb83db3abcb1d29bc98574f8c46ad8f1894daf26826&quot;},&quot;unresolved&quot;:[&quot;原图及模型不含完整设计条件；本图不构成成套工程设计。&quot;],&quot;publication&quot;:{&quot;status&quot;:&quot;published-teaching-reference&quot;,&quot;formalReplacement&quot;:true,&quot;publishedOn&quot;:&quot;2026-10-30&quot;},&quot;technicalReview&quot;:{&quot;status&quot;:&quot;source-based-teaching-reference&quot;,&quot;scope&quot;:&quot;按原图识读与所列条文范围核对，未作结构或系统性能全项验算。&quot;},&quot;assets&quot;:{&quot;textbook&quot;:&quot;textbook/passive-solar-wall-01.svg&quot;,&quot;node&quot;:&quot;node/passive-solar-wall-01.svg&qu