<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">轻钢龙骨纸面石膏板隔墙：组成与支承</title>
<desc id="desc">左图沿墙面正视，近侧面板局部省略以露出沿顶、沿地、边框和竖向龙骨；面板竖缝对应竖龙骨。右图为从上向下观察的局部横剖面，表达两侧纸面石膏板、竖龙骨和按设计设置的腔内填充。不按比例，不包含滑移顶缝、管线穿透、连接件详图或性能等级。</desc>
