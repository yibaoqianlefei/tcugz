件的热交换路径。&quot;,&quot;objects&quot;:[&quot;外侧玻璃&quot;,&quot;空气间层&quot;,&quot;外围护墙&quot;,&quot;上部进风口&quot;,&quot;下部出风口&quot;],&quot;boundary&quot;:&quot;模型不模拟温度场、气流或季节切换，不把特殊太阳能墙直接当成普通外保温。&quot;,&quot;primary&quot;:true,&quot;relatedPrinciples&quot;:[],&quot;applications&quot;:[&quot;practice/envelope-detail&quot;]},&quot;references&quot;:[{&quot;standard&quot;:&quot;GB/T 50001—2017 房屋建筑制图统一标准&quot;,&quot;clause&quot;:&quot;7.3.1～7.3.3、9.1.1～9.1.4&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-45613.htm&quot;,&quot;materialUrl&quot;:&quot;https://gf.cabr-fire.com/m/article-45652.htm&quot;,&quot;statusUrl&quot;:&quot;https://ebook.chinabuilding.com.cn/zbooklib/bookpdf/probation?SiteID=1&amp;bookID=102879&quot;,&quot;checkedOn&quot;:&quot;2026-10-30&quot;,&quot;verification&quot;:&quot;读取规范原文中的引出线及图例表达规则；材料图例疏密按阅读尺寸调整，数字图幅不冒充打印比例。&quot;},{&quot;standard&quot;:&quot;JGJ/T 267—2012 被动式太阳能建筑技术规范&quot;,&quot;clause&quot;:&quot;4.4、4.6、6.2（范围及相关原文定位）&quot;,&quot;url&quot;:&quot;https://ebook.chinabuilding.com.cn/zbooklib/book/detail/show?SiteID=1&amp;bookID=57523&quot;,&quot;textSource&quot;:&quot;https://pro5323b5d3-pic11.ysjianzhan.cn/upload/2JGJ-T267-2012BDSTYNJZJSGF.pdf&quot;,&quot;checkedOn&quot;:&quot;2026-10-30&quot;,&quot;verification&quot;:&quot;出版目录与标准扫描件章节已定位；原图厚度和孔口为实例，不由本图推定集热量、全年气密或玻璃安全性能。&quot;}],&quot;geometryDigests&quot;:{&quot;solar-section&quot;:&quot;497964e76fb3374298583cb83db3abcb1d29bc98574f8c46ad8f1894daf26826&quot;},&quot;unresolved&quot;:[&quot;原图及模型不含完整设计条件；本图不构成成套工程设计。&quot;],&quot;publication&quot;:{&quot;status&quot;:&quot;published-teaching-reference&quot;,&quot;formalReplacement&quot;:true,&quot;publishedOn&quot;:&quot;2026-10-30&quot;},&quot;technicalReview&quot;:{&quot;status&quot;:&quot;source-based-teaching-reference&quot;,&quot;scope&quot;:&quot;按原图识读与所列条文范围核对，未作结构或系统性能全项验算。&quot;},&quot;assets&quot;:{&quot;textbook&quot;:&quot;textbook/passive-solar-wall-01.svg&quot;,&quot;node&quot;:&quot;node/passive-solar-wall-01.svg&