<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1100" viewBox="0 0 620 1100" role="img" aria-labelledby="title desc"><title id="title">岩棉保温板外保温</title><desc id="desc">沿墙厚方向识别找平、防水、岩棉、抹面增强及饰面，区分保温、保护与固定的作用。</desc><metadata>{&quot;id&quot;:&quot;rockwool-insulation-01&quot;,&quot;title&quot;:&quot;粘贴岩棉保温板外保温&quot;,&quot;status&quot;:&quot;source-based&quot;,&quot;revision&quot;:&quot;source-based-v3&quot;,&quot;checkedOn&quot;:&quot;2026-10-29&quot;,&quot;original&quot;:{&quot;path&quot;:&quot;/images/wall/rockwool-insulation-diagram.png&quot;,&quot;sha256&quot;:&quot;0ea00499e560437361c27d9460b920f870130f56b2e98c20be54e9d609a3330a&quot;,&quot;figure&quot;:&quot;用户原图：图13-6&quot;,&quot;page&quot;:null},&quot;scope&quot;:&quot;保留原图基层、找平、防水、岩棉、抹面及饰面的先后关系；原图数值均作为实例记录。&quot;,&quot;parameters&quot;:[&quot;20厚1∶3水泥砂浆找平层&quot;,&quot;2厚聚合物水泥防水涂料&quot;,&quot;43厚岩棉保温板&quot;,&quot;5厚抹面胶浆，原图标内置160级耐碱玻纤网格布&quot;],&quot;geometryChecks&quot;:[&quot;防水涂料位于找平层外、岩棉内，不移至岩棉外侧。&quot;,&quot;增强网位于抹面层内。&quot;,&quot;涂料层绘图厚度夸大；原图实例数值与规范要求分开。&quot;],&quot;learningContexts&quot;:[{&quot;lesson&quot;:&quot;principles/thermal&quot;,&quot;lessonTitle&quot;:&quot;建筑保温&quot;,&quot;unitId&quot;:&quot;principles.thermal&quot;,&quot;unitTitle&quot;:&quot;保温、气密与防雨分别核对&quot;,&quot;question&quot;:&quot;外保温板连续铺设，为什么仍不能直接证明窗边热桥和漏风都已解决？&quot;,&quot;observe&quot;:[&quot;在泡沫塑料板外保温模型中点选保温板、胶粘剂、锚栓和基层，说明热流与固定路径分别经过哪里。&quot;,&quot;比较岩棉方案后，在窗墙安装缝草图上另画气密与防雨连接，标出大面模型无法证明的洞口连续性。&quot;],&quot;primary&quot;:false},{&quot;lesson&quot;:&quot;wall/wall-design-requirements&quot;,&quot;lessonTitle&quot;:&quot;墙体的设计要求&quot;,&quot;unitId&quot;:&quot;wall.thermal&quot;,&quot;unitTitle&quot;:&quot;保温、固定和外侧保护各做什么&quot;,&quot;question&quot;:&quot;把保温板贴满墙面，是否就得到完整的外墙性能？&quot;,&quot;observe&quot;:[&quot;点选保温板与基层墙体，再找胶粘、锚固和保护层的相邻位置。&quot;,&quot;对比岩棉做法，记录固定、找平及保护层的差异；再在纸上把这套层次接到窗洞四周。&quot;],&quot;primary&quot;:true}],&quot;teaching&quot;:{&quot;summary&quot;:&quot;沿墙厚方向识别找平、防水、岩棉、抹面增强及饰面，区分保温、保护与固定的作用。&quot;,&quot;points&quot;:[&quot;防水涂料位于找平层外侧、岩棉板内侧。&quot;,&quot;岩棉板通过粘结与锚固连接基层。&quot;,&quot;抹面胶浆内置增强网，外侧设置腻子和涂料。&quot;]},&quot;references&quot;:[{&quot;standard&quot;:&quot;GB/T 50001—2017 房屋建筑制图统一标准&quot;,&quot;clause&quot;:&quot;4.0.3、4.0.10、5.0.1及5.0.3：图线一致、文字清晰及宋体字型&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-45597.htm&quot;,&quot;fontUrl&quot;:&quot;https://gf.cabr-fire.com/m/article-45599.htm&quot;,&quot;review&quot;:&quot;已读取在线原文，采用剖切、可见轮廓、细引出线的层次，汉字采用宋体字型；绘图单位不冒充施工尺寸。&quot;},{&quot;standard&quot;:&quot;GB/T 50001—2017 房屋建筑制图统一标准&quot;,&quot;clause&quot;:&quot;7.3.1～7.3.3：引出线角度、文字落位与多层标注次序&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-45613.htm&quot;,&quot;review&quot;:&quot;引出线采用45°、60°或垂直折为水平线，细线0.25b，文字放于水平线端部。&quot;},{&quot;standard&quot;:&quot;GB/T 50001—2017 房屋建筑制图统一标准&quot;,&quot;clause&quot;:&quot;9.1.1～9.1.4：图例、附加说明与自编图例的表达边界&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-45652.htm&quot;,&quot;statusUrl&quot;:&quot;https://www.mohurd.gov.cn/gongkai/zc/wjk/art/2018/art_17339_234638.html&quot;,&quot;review&quot;:&quot;已阅读在线条文。这里只核对图例表达，不据此证明构造设计合规。&quot;},{&quot;standard&quot;:&quot;JGJ/T 480—2019 岩棉薄抹灰外墙外保温工程技术标准&quot;,&quot;clause&quot;:&quot;3.2.1～3.2.2：基本构造及连接方式&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/article-43951.htm&quot;,&quot;statusUrl&quot;:&quot;https://ebook.chinabuilding.com.cn/zbooklib/book/detail/show?SiteID=1&amp;bookID=114733&quot;,&quot;review&quot;:&quot;已核对出版社现行目录与在线原文。原图没有单列胶粘剂，不能据此取消粘结；本图保留原图识读身份，不能替代选定系统的构造设计。&quot;}],&quot;unresolved&quot;:[&quot;未完成适用专项标准、系统资料或结构设计的全项复核；不能称为施工图或国标认证图。&quot;],&quot;roundResults&quot;:[{&quot;round&quot;:1,&quot;result&quot;:&quot;已识别原图对象、图名与适用范围；正式替换前还需专项标准有效性及冲突清单。&quot;},{&quot;round&quot;:2,&quot;result&quot;:&quot;已读取列出的图例表达条文；外保温完整系统条文已单独核对，不把实例参数写成条文。&quot;},{&quot;round&quot;:3,&quot;result&quot;:&quot;新绘轮廓、层序与标注按原图逐项复核；详见geometryChecks。&quot;},{&quot;round&quot;:4,&quot;result&quot;:&quot;当前版本已逐图检查桌面文字边界，无裁切。窄屏模板验证另存记录，并非手机真机认证。&quot;}],&quot;replacesOriginal&quot;:true,&quot;rasterEmbedded&quot;:false,&quot;geometryDigest&quot;:&quot;19476118623673fd6519edf884fc1dbcf39ddde006df05042d80600614625bdb&quot;,&quot;nodeId&quot;:&quot;rockwool-insulation-01&quot;,&quot;path&quot;:&quot;/images/learning/rockwool-insulation-01.svg&quot;,&quot;width&quot;:620,&quot;height&quot;:1100,&quot;reviewStatus&quot;:&quot;technical-review-draft&quot;,&quot;usage&quot;:&quot;teaching-reference&quot;,&quot;publishedOn&quot;:&quot;2026-10-29&quot;,&quot;panel&quot;:{&quot;path&quot;:&quot;/images/learning/node-panels/rockwool-insulation-01.svg&quot;,&quot;width&quot;:620,&quot;height&quot;:1100,&quot;sourceGeometryDigest&quot;:&quot;6441d5b030d12bc4e583b3b63822a92cf87ebae3284110ed86e321a5b3c87f3d&quot;},&quot;presentation&quot;:&quot;node-panel&quot;,&quot;sourceGeometryDigest&quot;:&quot;6441d5b030d12bc4e583b3b63822a92cf87ebae3284110ed86e321a5b3c87f3d&quot;}</metadata><defs>
