# ============================================================
# 建筑构造交互教材 — Nginx 站点配置
# 放置位置：/etc/nginx/sites-available/building-node
# 启用方式：ln -s /etc/nginx/sites-available/building-node /etc/nginx/sites-enabled/
#
# 部署前提：
#   - 站点产物已放到 /var/www/building-node（dist/ 的内容）
#   - base 为 "/"（域名根目录，VITE_BASE_URL 默认值）
#   - 哈希路由，无需 SPA 重写（已附带 try_files 兜底，无害）
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name example.com;   # ← 换成你的域名

    # 配好 SSL 证书后，取消下面一行注释以强制跳转 HTTPS：
    # return 301 https://$host$request_uri;

    root /var/www/building-node;
    index index.html;

    # ---- 压缩 ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml;

    # ---- .glb 的 MIME 类型（nginx 默认 mime.types 不含 glb）----
    types {
        model/gltf-binary glb;
    }

    # ---- 带 hash 的 JS/CSS：一年强缓存（文件名变化即失效）----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 模型与图片：7 天缓存（文件名不变，改内容需清缓存）----
    location ~* \.(glb|png|jpe?g|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- 兜底（哈希路由用不到，保险起见保留）----
    location / {
        try_files $uri $uri/ /index.html;
    }
}

