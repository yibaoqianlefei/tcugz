<svg xmlns="http://www.w3.org/2000/svg" width="620" height="827.2" viewBox="0 0 620 827.2" role="img" aria-labelledby="title desc"><title id="title">框架结构布置</title><desc id="desc">梁柱平面骨架及原图的投影辅助线；未增加墙体或楼板。</desc><metadata>{&quot;id&quot;:&quot;frame-structure-layout-01&quot;,&quot;title&quot;:&quot;框架结构布置&quot;,&quot;revision&quot;:&quot;wall-source-r3&quot;,&quot;createdOn&quot;:&quot;2026-10-30&quot;,&quot;source&quot;:{&quot;path&quot;:&quot;/images/wall/frame-structure-layout-diagram.png&quot;,&quot;width&quot;:493,&quot;height&quot;:319,&quot;format&quot;:&quot;png&quot;,&quot;sha256&quot;:&quot;27caa89fe7e88146fcbcc92ce6c7c67af58dea98d3de2f2aef78be4dea4a204a&quot;,&quot;smallRasterScreening&quot;:true},&quot;scope&quot;:&quot;梁柱平面骨架及原图的投影辅助线；未增加墙体或楼板。&quot;,&quot;parameters&quot;:[],&quot;geometryChecks&quot;:[&quot;7列×4排，共28个柱位&quot;,&quot;框架梁与柱位相接&quot;,&quot;未把投影辅助线命名为楼板&quot;],&quot;knowledgeContext&quot;:{&quot;lessonKey&quot;:&quot;wall/wall-role&quot;,&quot;lessonTitle&quot;:&quot;墙体在建筑中的作用&quot;,&quot;lessonPath&quot;:&quot;basics/wall/wall-role.html&quot;,&quot;figureId&quot;:&quot;model-wall-roles&quot;,&quot;knowledgeId&quot;:&quot;wall.roles&quot;,&quot;question&quot;:&quot;外墙是否一定承重，内墙是否一定不承重？&quot;,&quot;principle&quot;:&quot;位置说明它分隔哪里，结构角色说明作用传给谁。框架中梁柱构成承重骨架；砌体承重体系中，楼板可把作用传给相应墙段。二者都需要可靠连接。&quot;,&quot;task&quot;:&quot;从两向梁追到柱，识别框架骨架。&quot;,&quot;objects&quot;:[&quot;框架梁&quot;,&quot;框架柱&quot;],&quot;boundary&quot;:&quot;梁柱模型不含楼板、填充墙、基础或连接配筋，不能用它验证整栋建筑的承载与抗侧性能。&quot;,&quot;primary&quot;:true,&quot;relatedPrinciples&quot;:[],&quot;applications&quot;:[&quot;practice/envelope-detail&quot;]},&quot;references&quot;:[{&quot;standard&quot;:&quot;GB/T 50001—2017 房屋建筑制图统一标准&quot;,&quot;clause&quot;:&quot;7.3.1～7.3.3、9.1.1～9.1.4&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-45613.htm&quot;,&quot;materialUrl&quot;:&quot;https://gf.cabr-fire.com/m/article-45652.htm&quot;,&quot;statusUrl&quot;:&quot;https://ebook.chinabuilding.com.cn/zbooklib/bookpdf/probation?SiteID=1&amp;bookID=102879&quot;,&quot;checkedOn&quot;:&quot;2026-10-30&quot;,&quot;verification&quot;:&quot;读取规范原文中的引出线及图例表达规则；材料图例疏密按阅读尺寸调整，数字图幅不冒充打印比例。&quot;}],&quot;geometryDigests&quot;:{&quot;plan-frame&quot;:&quot;5948450bdb8f5551fe3a96b981075368017f0b021f804acbb7b4ca6e610bbc49&quot;},&quot;unresolved&quot;:[&quot;原图及模型不含完整设计条件；本图不构成成套工程设计。&quot;],&quot;publication&quot;:{&quot;status&quot;:&quot;published-teaching-reference&quot;,&quot;formalReplacement&quot;:true,&quot;publishedOn&quot;:&quot;2026-10-30&quot;},&quot;technicalReview&quot;:{&quot;status&quot;:&quot;source-based-teaching-reference&quot;,&quot;scope&quot;:&quot;按原图识读与所列条文范围核对，未作结构或系统性能全项验算。&quot;},&quot;assets&quot;:{&quot;textbook&quot;:&quot;textbook/frame-structure-layout-01.svg&quot;,&quot;node&quot;:&quot;node/frame-structure-layout-01.svg&quot;},&quot;assetVersions&quot;:{&quot;textbook&quot;:&quot;e9ccb2492d0e&quot;,&quot;node&quot;:&quot;a94bc74c7f85&quot;},&quot;textbookSize&quot;:{&quot;width&quot;:1400,&quot;height&quot;:1225.2},&quot;nodeSize&quot;:{&quot;width&quot;:620,&quot;height&quot;:827.2},&quot;nodeId&quot;:&quot;frame-structure-layout-01&quot;,&quot;path&quot;:&quot;/images/learning/frame-structure-layout-01.svg&quot;,&quot;width&quot;:1400,&quot;height&quot;:1225.2,&quot;original&quot;:{&quot;path&quot;:&quot;/images/wall/frame-structure-layout-diagram.png&quot;,&quot;width&quot;:493,&quot;height&quot;:319,&quot;format&quot;:&quot;png&quot;,&quot;sha256&quot;:&quot;27caa89fe7e88146fcbcc92ce6c7c67af58dea98d3de2f2aef78be4dea4a204a&quot;,&quot;smallRasterScreening&quot;:true},&quot;status&quot;:&quot;source-based&quot;,&quot;reviewStatus&quot;:&quot;source-and-layout-checked&quot;,&quot;usage&quot;:&quot;teaching-reference&quot;,&quot;replacesOriginal&quot;:true,&quot;publishedOn&quot;:&quot;2026-10-30&quot;,&quot;teaching&quot;:{&quot;summary&quot;:&quot;先辨认实心柱位与梁线，再在模型中追踪梁端到柱的连接。细辅助线不代表本模型已有楼板或填充墙。&quot;,&quot;points&quot;:[&quot;7列×4排，共28个柱位&quot;,&quot;框架梁