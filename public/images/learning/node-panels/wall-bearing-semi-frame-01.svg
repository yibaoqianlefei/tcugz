<svg xmlns="http://www.w3.org/2000/svg" width="620" height="995.2" viewBox="0 0 620 995.2" role="img" aria-labelledby="title desc"><title id="title">承重布置（半框架承重）</title><desc id="desc">外墙、内部柱列、梁与右端板带的布置示意。</desc><metadata>{&quot;id&quot;:&quot;wall-bearing-semi-frame-01&quot;,&quot;title&quot;:&quot;墙体承重结构布置方案（半框架承重）&quot;,&quot;revision&quot;:&quot;wall-source-r3&quot;,&quot;createdOn&quot;:&quot;2026-10-30&quot;,&quot;source&quot;:{&quot;path&quot;:&quot;/images/wall/bearing-layout-semi-frame-diagram.png&quot;,&quot;width&quot;:348,&quot;height&quot;:216,&quot;format&quot;:&quot;png&quot;,&quot;sha256&quot;:&quot;f1e98fef39c261ce338e8fd64160cefa22dcee6099d72ce7e40f393f62b38751&quot;,&quot;smallRasterScreening&quot;:true},&quot;scope&quot;:&quot;外墙、内部柱列、梁与右端板带的布置示意。&quot;,&quot;parameters&quot;:[],&quot;geometryChecks&quot;:[&quot;内部7个柱位保持单列&quot;,&quot;外围墙与内部梁柱分开&quot;,&quot;右端楼板排列方向与原图一致&quot;],&quot;knowledgeContext&quot;:{&quot;lessonKey&quot;:&quot;wall/wall-masonry&quot;,&quot;lessonTitle&quot;:&quot;砌体结构&quot;,&quot;lessonPath&quot;:&quot;basics/wall/wall-masonry.html&quot;,&quot;figureId&quot;:&quot;model-wall-bearing&quot;,&quot;knowledgeId&quot;:&quot;wall.bearing&quot;,&quot;question&quot;:&quot;为什么横墙、纵墙、纵横墙和半框架布置会形成不同空间？&quot;,&quot;principle&quot;:&quot;楼板支承、墙段连续与房间分隔共同约束布置。改变支承方向或用内部梁柱替换部分墙段，会改变传力路线与空间组织；围墙外形相似并不表示体系相同。&quot;,&quot;task&quot;:&quot;识别内部柱列与横向梁，再观察外围墙体；区别于完全梁柱骨架。&quot;,&quot;objects&quot;:[&quot;楼板&quot;,&quot;横向梁&quot;,&quot;柱&quot;,&quot;墙体&quot;],&quot;boundary&quot;:&quot;这些是单层布置示意，墙段和楼板多为合并网格；不展示结构计算、完整连接或抗震验算。&quot;,&quot;primary&quot;:true,&quot;relatedPrinciples&quot;:[],&quot;applications&quot;:[&quot;practice/envelope-detail&quot;]},&quot;references&quot;:[{&quot;standard&quot;:&quot;GB/T 50001—2017 房屋建筑制图统一标准&quot;,&quot;clause&quot;:&quot;7.3.1～7.3.3、9.1.1～9.1.4&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-45613.htm&quot;,&quot;materialUrl&quot;:&quot;https://gf.cabr-fire.com/m/article-45652.htm&quot;,&quot;statusUrl&quot;:&quot;https://ebook.chinabuilding.com.cn/zbooklib/bookpdf/probation?SiteID=1&amp;bookID=102879&quot;,&quot;checkedOn&quot;:&quot;2026-10-30&quot;,&quot;verification&quot;:&quot;读取规范原文中的引出线及图例表达规则；材料图例疏密按阅读尺寸调整，数字图幅不冒充打印比例。&quot;},{&quot;standard&quot;:&quot;GB 55002—2021 建筑与市政工程抗震通用规范&quot;,&quot;clause&quot;:&quot;5.5.8、5.5.9、5.5.11&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-39119.htm&quot;,&quot;checkedOn&quot;:&quot;2026-10-30&quot;,&quot;verification&quot;:&quot;读取砌体结构房屋整体联系、楼屋面支承与拉结、相关构件混凝土要求；不以平面示意证明结构计算或实际抗震合规。&quot;}],&quot;geometryDigests&quot;:{&quot;plan-semi&quot;:&quot;33418062ba66f8ce324cc0e8a5f1f4453ebc096b905a8cb04692a6496cdc5730&quot;},&quot;unresolved&quot;:[&quot;原图及模型不含完整设计条件；本图不构成成套工程设计。&quot;],&quot;publication&quot;:{&quot;status&quot;:&quot;published-teaching-reference&quot;,&quot;formalReplacement&quot;:true,&quot;publishedOn&quot;:&quot;2026-10-30&quot;},&quot;technicalReview&quot;:{&quot;status&quot;:&quot;source-based-teaching-reference&quot;,&quot;scope&quot;:&quot;按原图识读与所列条文范围核对，未作结构或系统性能全项验算。&quot;},&quot;assets&quot;:{&quot;textbook&quot;:&quot;textbook/wall-bearing-semi-frame-01.svg&quot;,&quot;node&quot;:&quot;node/wall-bearing-semi-frame-01.svg&quot;},&quot;assetVersions&quot;:{&quot;textbook&quot;:&quot;bd9bd3f22e29&quot;,&quot;node&quot;:&quot;258fe9cf837b&quot;},&quot;textbookSize&quot;:{&quot;width&quot;:1400,&quot;height&quot;:1337.2},&quot;nodeSize&quot;:{&quot;width&quot;:620,&quot;height&quot;:995.2},&quot;nodeId&quot;:&quot;wall-bearing-semi-frame-01&quot;,&quot;path&quot;:&quot;/images/learning/wall-bearing-semi-frame-01.svg&quot;,&quot;width&quot;:1400,&quot;height&quot;:1337.2,&quot;original&quot;:{&quot;path&quot;:&quot;/images/wall/bearing-layout-semi-frame-diagram.png&quot;,&quot;width&quot;:348,&quot;height&quot;:216,&quot;format&quot;:&quot;png&quot;,&quot;sha256&quot;:&quot;f1e98fef39c261ce338e8fd64160cefa22dcee6099d72ce7e40f393f62b38751&quot;,&quot;smallRasterScreening&quot;:tr