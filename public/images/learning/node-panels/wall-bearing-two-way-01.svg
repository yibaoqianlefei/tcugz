<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1051.2" viewBox="0 0 620 1051.2" role="img" aria-labelledby="title desc"><title id="title">承重布置（纵横墙承重）</title><desc id="desc">各局部房间具有不同板带排列方向，保留左下开敞梁区。</desc><metadata>{&quot;id&quot;:&quot;wall-bearing-two-way-01&quot;,&quot;title&quot;:&quot;墙体承重结构布置方案（纵横墙承重）&quot;,&quot;revision&quot;:&quot;wall-source-r3&quot;,&quot;createdOn&quot;:&quot;2026-10-30&quot;,&quot;source&quot;:{&quot;path&quot;:&quot;/images/wall/bearing-layout-two-way-diagram.png&quot;,&quot;width&quot;:348,&quot;height&quot;:216,&quot;format&quot;:&quot;png&quot;,&quot;sha256&quot;:&quot;f6b5777d03f45e5be1b58b974fc2c4dc52ceae5298bc4508f5122e2b64f82059&quot;,&quot;smallRasterScreening&quot;:true},&quot;scope&quot;:&quot;各局部房间具有不同板带排列方向，保留左下开敞梁区。&quot;,&quot;parameters&quot;:[],&quot;geometryChecks&quot;:[&quot;上左窄板带、上右纵向板带、下右横向板带分区&quot;,&quot;左下为梁区而非补画承重墙&quot;,&quot;纵横墙分隔保持原图相邻关系&quot;],&quot;knowledgeContext&quot;:{&quot;lessonKey&quot;:&quot;wall/wall-masonry&quot;,&quot;lessonTitle&quot;:&quot;砌体结构&quot;,&quot;lessonPath&quot;:&quot;basics/wall/wall-masonry.html&quot;,&quot;figureId&quot;:&quot;model-wall-bearing&quot;,&quot;knowledgeId&quot;:&quot;wall.bearing&quot;,&quot;question&quot;:&quot;为什么横墙、纵墙、纵横墙和半框架布置会形成不同空间？&quot;,&quot;principle&quot;:&quot;楼板支承、墙段连续与房间分隔共同约束布置。改变支承方向或用内部梁柱替换部分墙段，会改变传力路线与空间组织；围墙外形相似并不表示体系相同。&quot;,&quot;task&quot;:&quot;按房间分别读板的排列方向，不能给整栋建筑只画一种箭头。&quot;,&quot;objects&quot;:[&quot;楼板&quot;,&quot;墙体&quot;,&quot;横向梁&quot;],&quot;boundary&quot;:&quot;这些是单层布置示意，墙段和楼板多为合并网格；不展示结构计算、完整连接或抗震验算。&quot;,&quot;primary&quot;:true,&quot;relatedPrinciples&quot;:[],&quot;applications&quot;:[&quot;practice/envelope-detail&quot;]},&quot;references&quot;:[{&quot;standard&quot;:&quot;GB/T 50001—2017 房屋建筑制图统一标准&quot;,&quot;clause&quot;:&quot;7.3.1～7.3.3、9.1.1～9.1.4&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-45613.htm&quot;,&quot;materialUrl&quot;:&quot;https://gf.cabr-fire.com/m/article-45652.htm&quot;,&quot;statusUrl&quot;:&quot;https://ebook.chinabuilding.com.cn/zbooklib/bookpdf/probation?SiteID=1&amp;bookID=102879&quot;,&quot;checkedOn&quot;:&quot;2026-10-30&quot;,&quot;verification&quot;:&quot;读取规范原文中的引出线及图例表达规则；材料图例疏密按阅读尺寸调整，数字图幅不冒充打印比例。&quot;},{&quot;standard&quot;:&quot;GB 55002—2021 建筑与市政工程抗震通用规范&quot;,&quot;clause&quot;:&quot;5.5.8、5.5.9、5.5.11&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-39119.htm&quot;,&quot;checkedOn&quot;:&quot;2026-10-30&quot;,&quot;verification&quot;:&quot;读取砌体结构房屋整体联系、楼屋面支承与拉结、相关构件混凝土要求；不以平面示意证明结构计算或实际抗震合规。&quot;}],&quot;geometryDigests&quot;:{&quot;plan-two-way&quot;:&quot;e4f5e98302e068aae6a1dfed0730d7913d2140dca51fc9f7a80bfbdf960a6c81&quot;},&quot;unresolved&quot;:[&quot;原图及模型不含完整设计条件；本图不构成成套工程设计。&quot;],&quot;publication&quot;:{&quot;status&quot;:&quot;published-teaching-reference&quot;,&quot;formalReplacement&quot;:true,&quot;publishedOn&quot;:&quot;2026-10-30&quot;},&quot;technicalReview&quot;:{&quot;status&quot;:&quot;source-based-teaching-reference&quot;,&quot;scope&quot;:&quot;按原图识读与所列条文范围核对，未作结构或系统性能全项验算。&quot;},&quot;assets&quot;:{&quot;textbook&quot;:&quot;textbook/wall-bearing-two-way-01.svg&quot;,&quot;node&quot;:&quot;node/wall-bearing-two-way-01.svg&quot;},&quot;assetVersions&quot;:{&quot;textbook&quot;:&quot;c4d95ec08049&quot;,&quot;node&quot;:&quot;4c166f2faf93&quot;},&quot;textbookSize&quot;:{&quot;width&quot;:1400,&quot;height&quot;:1337.2},&quot;nodeSize&quot;:{&quot;width&quot;:620,&quot;height&quot;:1051.2},&quot;nodeId&quot;:&quot;wall-bearing-two-way-01&quot;,&quot;path&quot;:&quot;/images/learning/wall-bearing-two-way-01.svg&quot;,&quot;width&quot;:1400,&quot;height&quot;:1337.2,&quot;original&quot;:{&quot;path&quot;:&quot;/images/wall/bearing-layout-two-way-diagram.png&quot;,&quot;width&quot;:348,&quot;height&quot;:216,&quot;format&quot;:&quot;png&quot;,&quot;sha256&quot;:&quot;f6b5777d03f45e5be1b58b974fc2c4dc52ceae5298bc4508f5122e2b64f82059&quot;,&quot;smallRasterScreening&quot;:true},&quo