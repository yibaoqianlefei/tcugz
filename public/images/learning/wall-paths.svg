<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" data-edition="standards-review-2026-10-28">
<title id="title">砌筑墙体：防潮层的位置与连续性</title>
<desc id="desc">两个独立局部剖面。A中墙身水平防潮层贯穿墙厚，位于室内地面垫层范围并高于室外地面；B中高、低地面对应的墙身水平防潮层由高侧邻土墙面的竖向防潮层连接。只表达墙身防潮位置，不表示地面防潮、地下防水、基础或散水的完整设计。</desc>
<metadata>{"id":"wall-paths","title":"砌筑墙体：防潮层的位置与连续性","scope":"砌筑墙体墙身防潮；两个独立局部剖面分别说明室内外地面与相邻室内地面高差。","exclusions":["不表示地面防潮、地下防水、基础、散水、洞口或保温系统。","色带厚度及图形比例不提供施工参数。"],"sources":[{"standard":"GB 55031—2022 民用建筑通用规范","clause":"6.2.3第1款","pages":"正文16页；政府公开PDF20页","url":"https://sjw.nanjing.gov.cn/gdzsj/zcfg/gfxwj/202402/P020240228546256431161.pdf","statusUrl":"https://www.mohurd.gov.cn/gongkai/zc/wjk/art/2024/art_17339_767703.html","appliesTo":"室外地面以上、室内地面垫层处连续水平防潮；室内高差范围邻土侧附加防潮。全部条文强制，2023-03-01实施。"},{"standard":"GB/T 50001—2017 房屋建筑制图统一标准","clause":"4.0.1～4.0.2、7.3.1、9.1.2","pages":"正文13、22、28页；官方PDF19、28、34页","url":"https://www.mohurd.gov.cn/gongkai/zc/wjk/art/2018/art_17339_234638.html","appliesTo":"图线层次、引出线及小范围材料标识的教学表达；本图不按比例"}],"geometry":"检查A水平层贯穿墙厚且位于垫层范围并高于室外地面；B竖向层位于高侧邻土面并接续两道水平层。","path":"/images/learning/wall-paths.svg","checkedOn":"2026-10-29","status":"reviewed","reviews":[{"round":1,"result":"核对官方公告或出版社现行目录，明确效力、适用对象及通用规范优先关系。"},{"round":2,"result":"阅读记录所列原文页与相关图线条款，确定可绘制范围。"},{"round":3,"result":"检查A水平层贯穿墙厚且位于垫层范围并高于室外地面；B竖向层位于高侧邻土面并接续两道水平层。"},{"round":4,"result":"SVG渲染、教材图注与网页桌面及手机表现复核；验证记录见本版审计截图。"}]}</metadata>
