<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">烧结普通砖砌体：相邻皮竖缝比较</title>
  <desc id="desc">两栏均为烧结普通砖砌体的局部立面，砖面长高比采用教材240比53。左栏是相邻皮竖缝交错的半砖错缝排列示例；右栏是连续竖缝反例，不采用。砖块之间保留灰缝带。左右折断线表示砌体在图外延续，不是墙端。本图只表达GB 55007—2021第5.1.3条的上下错缝原则，未表达墙厚方向搭砌、墙端及交接构造，不标最小搭砌值和灰缝厚度，也不能据此判定整墙合格。</desc>
  <metadata>{"id":"masonry-bond","title":"烧结普通砖砌体：相邻皮竖缝比较","scope":"烧结普通砖局部立面，上下皮竖缝错开与连续竖缝反例。","exclusions":["不表示墙厚方向搭砌、转角、墙端或交接。","半砖错缝仅为本图示例，不是所有块材的通用最低搭砌值。","240∶53外形比例来自教材砖面实例；灰缝可读表达不等于施工尺寸。"],"sources":[{"standard":"GB 55007—2021 砌体结构通用规范","clause":"5.1.3","pages":"正文13页；锡林郭勒盟住建局公开PDF16页","url":"https://www.tpsq.gov.cn/eportal/attachDir/jsj/2024/09/2024091911062927540.pdf","statusUrl":"https://www.mohurd.gov.cn/gongkai/zc/wjk/art/2021/art_17339_761188.html","appliesTo":"砌体交接及上下错缝原则，2022-01-01实施，通用规范优先。"},{"standard":"GB 50203—2011 砌体结构工程施工质量验收规范","clause":"5.3.1","pages":"正文16页","url":"https://zjjcmspublic.oss-cn-hangzhou-zwynet-d01-a.internet.cloud.zj.gov.cn/jcms_files/jcms1/web3162/site/attach/0/ce650cb7f5db41ceadf49a8f43375c35.pdf","statusUrl":"https://ebook.chinabuilding.com.cn/zbooklib/book/detail/show?SiteID=1&amp;bookID=60862&amp;isEnterprise=Y","appliesTo":"砖砌体组砌补充核对，不将已被通用规范替代的条文当作独立最高依据。"},{"standard":"GB/T 50001—2017 房屋建筑制图统一标准","clause":"4.0.1～4.0.2、7.3.1、9.1.2","pages":"正文13、22、28页；官方PDF19、28、34页","url":"https://www.mohurd.gov.cn/gongkai/zc/wjk/art/2018/art_17339_234638.html","appliesTo":"图线层次、引出线及小范围材料标识的教学表达；本图不按比例"}],"geometry":"检查两栏灰缝带、左相邻皮半砖错开、右连续竖缝、两侧截断符号和图外延续；不加入通用最小搭砌数值。","path":"/images/learning/masonry-bond.svg","checkedOn":"2026-10-29","status":"reviewed","reviews":[{"round":1,"result":"核对官方公告或出版社现行目录，明确效力、适用对象及通用规范优先关系。"},{"round":2,"result":"阅读记录所列原文页与相关图线条款，确定可绘制范围。"},{"round":3,"result":"检查两栏灰缝带、左相邻皮半砖错开、右连续竖缝、两侧截断符号和图外延续；不加入通用最小搭砌数值。"},{"round":4,"result":"SVG渲染、教材图注与网页桌面及手机表现复核；验证记录见本版审计截图。"}]}</metadata>
