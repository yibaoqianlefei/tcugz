<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc"><title id="title">砌体构造柱 · 马牙槎与拉结关系</title><desc id="desc">通过马牙槎、柱纵筋与拉结钢筋，认识构造柱与砌体交接的整体联系，并对应立面与横剖面。</desc><metadata>{&quot;id&quot;:&quot;construction-column-01&quot;,&quot;title&quot;:&quot;砌体构造柱 · 马牙槎与拉结关系&quot;,&quot;status&quot;:&quot;source-based&quot;,&quot;revision&quot;:&quot;source-based-v4&quot;,&quot;checkedOn&quot;:&quot;2026-10-29&quot;,&quot;original&quot;:{&quot;path&quot;:&quot;/images/wall/construction-column-diagram.png&quot;,&quot;sha256&quot;:&quot;ad7da0f4e6fe944c3b2ab53cb3c2a34e0f6796189e77650c0115839bf3134cf5&quot;,&quot;figure&quot;:&quot;用户原图：构造柱立面与1—1剖面&quot;,&quot;page&quot;:null},&quot;scope&quot;:&quot;沿用用户原图马牙槎及拉结钢筋的位置关系，原配筋与尺寸列为实例记录；非现行通用配筋详图。&quot;,&quot;parameters&quot;:[&quot;原图墙厚240&quot;,&quot;原图马牙槎示意≥60、每步≤300&quot;,&quot;原图拉结2Φ6@500、两侧延伸≥1000&quot;,&quot;原图纵筋4Φ12及底部构造为示例记录&quot;],&quot;geometryChecks&quot;:[&quot;马牙槎左右与中部柱核保持原图对应，不把凸齿反画成空洞。&quot;,&quot;立面与1—1横剖使用同一中部柱位；横剖保持原图T形墙肢，不增加下侧墙体，保留拉结钢筋端部弯折。&quot;,&quot;原配筋参数只在实例资料栏列示，不作为统一要求。&quot;],&quot;learningContexts&quot;:[{&quot;lesson&quot;:&quot;wall/wall-masonry&quot;,&quot;lessonTitle&quot;:&quot;砌体结构&quot;,&quot;unitId&quot;:&quot;wall.integrity&quot;,&quot;unitTitle&quot;:&quot;把墙的水平联系与竖向联系接起来&quot;,&quot;question&quot;:&quot;构造柱与芯柱在哪里形成联系，为什么都不能代替承重墙？&quot;,&quot;observe&quot;:[&quot;在构造柱模型中依次点选墙体、马牙槎、钢筋、圈梁，解释相邻构件怎样形成联系。&quot;,&quot;进入芯柱模型，观察增强构件从墙外预留截面转到砌块孔道内部后的施工条件变化。&quot;],&quot;primary&quot;:true}],&quot;teaching&quot;:{&quot;summary&quot;:&quot;通过马牙槎、柱纵筋与拉结钢筋，认识构造柱与砌体交接的整体联系，并对应立面与横剖面。&quot;,&quot;points&quot;:[&quot;马牙槎使墙体与构造柱交错咬合。&quot;,&quot;横剖面中4个实心圆点表示柱纵筋，闭合环线表示箍筋。&quot;,&quot;沿纵横墙分别识别2根拉结筋、端部短弯钩和柱内弯折。&quot;,&quot;1—1对准立面中的拉结筋层，尺寸与配筋为图示实例参数。&quot;]},&quot;references&quot;:[{&quot;standard&quot;:&quot;GB/T 50001—2017 房屋建筑制图统一标准&quot;,&quot;clause&quot;:&quot;4.0.3、4.0.10、5.0.1及5.0.3：图线一致、文字清晰及宋体字型&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-45597.htm&quot;,&quot;fontUrl&quot;:&quot;https://gf.cabr-fire.com/m/article-45599.htm&quot;,&quot;review&quot;:&quot;已读取在线原文，采用剖切、可见轮廓、细引出线的层次，汉字采用宋体字型；绘图单位不冒充施工尺寸。&quot;},{&quot;standard&quot;:&quot;GB/T 50001—2017 房屋建筑制图统一标准&quot;,&quot;clause&quot;:&quot;7.3.1～7.3.3：引出线角度、文字落位与多层标注次序&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-45613.htm&quot;,&quot;review&quot;:&quot;引出线采用45°、60°或垂直折为水平线，细线0.25b，文字放于水平线端部。&quot;},{&quot;standard&quot;:&quot;GB/T 50001—2017 房屋建筑制图统一标准&quot;,&quot;clause&quot;:&quot;9.1.1～9.1.4：图例、附加说明与自编图例的表达边界&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-45652.htm&quot;,&quot;statusUrl&quot;:&quot;https://www.mohurd.gov.cn/gongkai/zc/wjk/art/2018/art_17339_234638.html&quot;,&quot;review&quot;:&quot;已阅读在线条文。这里只核对图例表达，不据此证明构造设计合规。&quot;},{&quot;standard&quot;:&quot;GB 55007—2021 砌体结构通用规范&quot;,&quot;clause&quot;:&quot;5.1.9：砌体与构造柱连接、拉结及施工顺序&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-39248.htm&quot;,&quot;officialPdf&quot;:&quot;https://sjw.nanjing.gov.cn/gdzsj/zcfg/gfxwj/202402/P020240228542309501241.pdf&quot;,&quot;page&quot;:&quot;印刷页13&quot;,&quot;review&quot;:&quot;核对马牙槎、拉结及先砌墙后浇柱的原则；本条不能证明原图全部钢筋数量、间距与锚固适用于任意工程。&quot;},{&quot;standard&quot;:&quot;GB 55002—2021 建筑与市政工程抗震通用规范&quot;,&quot;clause&quot;:&quot;5.5.8及5.5.11：砌体房屋的整体性及构件混凝土&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-39119.htm&quot;,&quot;review&quot;:&quot;本节适用的砌体结构房屋中，构造柱、芯柱、圈梁等构件混凝土不低于C25；不把旧模型C15改标Cb20后就视为完成全部校核。&quot;},{&quot;standard&quot;:&quot;GB/T 50105—2010 建筑结构制图标准&quot;,&quot;clause&quot;:&quot;3.1.1、3.1.3及3.1.4：钢筋图例、标注及剖面表示&quot;,&quot;url&quot;:&quot;https://gf.cabr-fire.com/m/article-16923.htm&quot;,&quot;review&quot;:&quot;钢筋截面与沿长度方向的钢筋分开表达，标注对应引出对象；本图不据图例推定钢筋实际制作长度及箍筋规格。&quot;}],&quot;unresolved&quot;:[&quot;未完成适用专项标准、系统资料或结构设计的全项复核；不能称为施工图或国标认证图。&quot;],&quot;roundResults&quot;:[{&quot;round&quot;:1,&quot;result&quot;:&quot;已识别原图对象、图名与适用范围；正式替换前还需专项标准有效性及冲突清单。&quot;},{&quot;round&quot;:2,&quot;result&quot;:&quot;已读取列出的图例表达条文；外保温完整系统条文已单独核对，不把实例参数写成条文。&quot;},{&quot;round&quot;:3,&quot;result&quot;:&quot;新绘轮廓、层序与标注按原图逐项复核；详见geometryChecks。&quot;},{&quot;round&quot;:4,&quot;result&quot;:&quot;当前版本已逐图检查桌面文字边界，无裁切。窄屏模板验证另存记录，并非手机真机认证。&quot;}],&quot;replacesOriginal&quot;:true,&quot;rasterEmbedded&quot;:false,&quot;geometryDigest&quot;:&quot;5536bea7a98544202b323e891c63344eea5de1ae1f8638ac38492239b1d41e41&quot;,&quot;nodeId&quot;:&quot;construction-column-01&quot;,&quot;path&quot;:&quot;/images/learning/construction-column-01.svg&quot;,&quot;width&quot;:1400,&quot;height&quot;:1120,&quot;reviewStatus&quot;:&quot;technical-review-draft&quot;,&quot;usage&quot;:&quot;teaching-reference&quot;,&quot;publishedOn&quot;:&quot;2026-10-29&quot;,&quot;panel&quot;:{&quot;path&quot;:&quot;/images/learning/node-panels/construction-column-01.svg&quot;,&quot;width&quot;:620,&quot;height&quot;:1230,&quot;sourceGeometryDigest&quot;:&quot;d0f16d4de88af14304e6ddf35a8f7b897332124ba59ec24f72273d1e6c7308c1&quot;}}</metadata><defs>
