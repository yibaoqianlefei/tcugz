text x="370" y="150" font-size="23" text-anchor="middle">240</text><path d="M405 160L585 160" fill="none" class="fine" /><path d="M399 166L411 154" fill="none" class="medium" /><path d="M579 166L591 154" fill="none" class="medium" /><text x="495" y="150" font-size="23" text-anchor="middle">≥1000</text><path d="M125 220L125 380" fill="none" class="fine" /><path d="M119 226L131 214" fill="none" class="medium" /><path d="M119 386L131 374" fill="none" class="medium" /><text x="113" y="300" font-size="21" text-anchor="middle" transform="rotate(-90 113 300)">500</text><path d="M125 380L125 540" fill="none" class="fine" /><path d="M119 386L131 374" fill="none" class="medium" /><path d="M119 546L131 534" fill="none" class="medium" /><text x="113" y="460" font-size="21" text-anchor="middle" transform="rotate(-90 113 460)">500</text><path d="M115 220L150 220" fill="none" class="fine" /><path d="M115 380L150 380" fill="none" class="fine" /><path d="M115 540L150 540" fill="none" class="fine" /><path d="M75 380H105V400" fill="none" class="cut" data-role="section-cut"/><path d="M670 380H640V400" fill="none" class="cut" data-role="section-cut"/><text x="85" y="425" font-size="22" >1</text><text x="640" y="425" font-size="22" >1</text><text x="140" y="674" font-size="23" >立面（局部）</text><path d="M160 850H335V690H405V850H585V920H160Z" fill="url(#masonry)" class="cut" /><g data-role="column-section"><rect x="335" y="850" width="70" height="70" fill="#fff" class="medium" /><rect x="342" y="857" width="56" height="56" fill="none" class="medium" rx="2" data-role="column-stirrup"/><path d="M184 879H174Q171 879 171 876Q171 873 174 873H569Q572 873 572 876Q572 879 569 879H559" fill="none" class="rebar" data-role="tie-x" style="stroke-width:3.2"/><path d="M184 891H174Q171 891 171 894Q171 897 174 897H569Q572 897 572 894Q572 891 569 891H559" fill="none" class="rebar" data-role="tie-x" style="stroke-width:3.2"/><path d="M365 718V710Q365 704 359 704Q353 704 353 710V875L382 904" fill="none" class="rebar" data-role="tie-y" style="stroke-width:3.2"/><path d="M377 718V710Q377 704 383 704Q389 704 389 710V875L360 904" fill="none" class="rebar" data-role="tie-y" style="stroke-width:3.2"/><circle data-role="column-longitudinal-section" cx="348" cy="863" r="5" fill="#202831"/><circle data-role="column-longitudinal-section" cx="392" cy="863" r="5" fill="#202831"/><circle data-role="column-longitudinal-section" cx="348" cy="907" r="5" fill="#202831"/><circle data-role="column-longitudinal-section" cx="392" cy="907" r="5" fill="#202831"/></g><text x="260" y="937" font-size="21" >1—1 横剖面 · T形墙交接</text><circle cx="315" cy="405" r="3" fill="#202831"/><path d="M315 405L515 205H765" fill="none" class="fine" /><text x="785" y="212" font-size="24" >马牙槎</text><text x="785" y="243" font-size="19" fill="#66717f">墙体与构造柱交错咬合。</text><circle cx="355" cy="475" r="3" fill="#202831"/><path d="M355 475L495 335H765" fill="none" class="fine" /><text x="785" y="342" font-size="24" >柱纵向钢筋</text><text x="785" y="373" font-size="19" fill="#66717f">纵向钢筋位于柱核内。</text><circle cx="510" cy="380" r="3" fill="#202831"/><path d="M510 380L595 465H765" fill="none" class="fine" /><text x="785" y="472" font-size="24" >墙柱拉结</text><text x="785" y="503" font-size="19" fill="#66717f">拉结钢筋连接墙体与构造柱。</text><text x="785" y="595" font-size="24" >1—1 横剖面：T形墙交接</text><text x="785" y="633" font-size="19" >沿纵横墙交接布置拉结钢筋。</text><text x="785" y="674" font-size="19" fill="#465b96">图示实例参数（mm）</text><path d="M389 810L479 720H765" fill="none" class="fine" /><text x="785" y="727" font-size="24" >2Φ6@500 墙体拉结筋</text><text x="785" y="758" font-size="19" fill="#66717f">沿纵横墙布置，按图示弯折进入柱内。</text><path d="M392 863L455 800H765" fill="none" class="fine" /><text x="785" y="807" font-size="24" >4Φ12 柱纵筋（剖切）</text><text x="785" y="838" font-size="19" fill="#66717f">横剖面以4个实心圆点表示。</text><path d="M398 889L399 890H765" fill="none" class="fine" /><text x="785" y="897" font-size="24" >箍筋</text><text x="785" y="928" font-size="19" fill="#66717f">以闭合环线表示，围住柱纵筋。</text><path d="M65 945L1335 945" fill="none" class="fine" /><text x="65" y="975" font-size="21" font-weight="700">构造要点</text><text x="65" y="1008" font-size="19" >通过马牙槎、柱纵筋与拉结钢筋，认识构造柱与砌体交接的整体联系，并对应立面与横剖面。</text><text x="65" y="1042" font-size="17" fill="#66717f">制图依据：GB/T 50001—2017（图线、字体、引出线及材料图例）</text><text x="65" y="1071" font-size="17" fill="#66717f">构造依据：GB 55007—2021 5.1.9；GB 55002—2021 5.5.8及5.5.11；GB/T 50105—2010 3.1.1、3.1.3及3.1.4</text></g></svg>