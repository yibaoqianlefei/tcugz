<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1000" viewBox="85 60 690 960" role="img" aria-labelledby="title description">
  <title id="title">窗框与开启窗扇构造示意</title>
  <desc id="description">透明背景上的窗框、框内槽口和开启窗扇空间示意，以暖白灰色材料和深色细轮廓呈现。此图为章节示意，不表示特定产品或标准尺寸。</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f1ea"/>
      <stop offset="1" stop-color="#d6d6d3"/>
    </linearGradient>
    <linearGradient id="reveal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#b9babe"/>
      <stop offset="1" stop-color="#e3e3df"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c3d0d7" stop-opacity=".48"/>
      <stop offset=".55" stop-color="#e8eceb" stop-opacity=".25"/>
      <stop offset="1" stop-color="#b7c4cf" stop-opacity=".48"/>
    </linearGradient>
  </defs>
  <g stroke="#343944" stroke-width="1.65" stroke-linejoin="round">
    <!-- Fixed frame: rear returns express the frame depth without a ground plate. -->
    <path d="M160 200 600 120 670 155 230 235Z" fill="#eeeee8"/>
    <path d="M600 120 670 155 670 845 600 810Z" fill="#bdbfc1"/>
    <path d="M160 890 600 810 670 845 230 925Z" fill="#c2c3c1"/>
    <path d="M160 200 600 120 600 810 160 890Z M210 248 210 823 550 761 550 186Z" fill="url(#frame)" fill-rule="evenodd"/>
    <path d="M210 248 280 283 620 221 550 186Z" fill="#b5b7bb"/>
    <path d="M550 186 620 221 620 796 550 761Z" fill="url(#reveal)"/>
    <path d="M210 823 550 761 620 796 280 858Z" fill="#e7e6df"/>
    <path d="M280 283 620 221 620 796 280 858" fill="none" stroke="#67717c" stroke-width="1.15"/>
    <!-- Inward opening sash, shown with real frame thickness and clear glazing. -->
    <path d="M210 248 530 388 545 402 225 262Z" fill="#f7f5ef"/>
    <path d="M530 388 545 402 545 977 530 963Z" fill="#aaafb4"/>
    <path d="M210 248 530 388 530 963 210 823Z" fill="url(#frame)"/>
    <path d="M238 291 502 407 502 920 238 805Z" fill="url(#glass)"/>
    <path d="M246 304 491 411 491 907 246 800Z" fill="none" stroke="#81909d" stroke-width=".95"/>
    <path d="M265 323 457 407 457 428 265 344Z" fill="#fff" fill-opacity=".44" stroke="none"/>
    <path d="M278 425 405 480 405 803 278 748Z" fill="#fff" fill-opacity=".16" stroke="none"/>
    <!-- Small hinge and handle indications; deliberately no dimension annotations. -->
    <path d="M203 345 219 352 219 395 203 388Z M203 689 219 696 219 739 203 732Z" fill="#979fa7"/>
    <path d="M510 628 519 632 519 677 510 673Z" fill="#687380"/>
    <path d="M513 651 493 642 490 646 510 655" fill="none" stroke="#343e4c" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
