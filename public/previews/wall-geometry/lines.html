<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>墙体 · 线与接缝 — 建筑构造交互教材</title>
    <link rel="stylesheet" href="./shared.css" />
    <link rel="stylesheet" href="./lines.css" />
    <script type="module" src="./shared.js"></script>
  </head>
  <body class="variant-lines" data-variant="lines">
    <header class="preview-topbar" data-shared-header></header>
    <nav class="preview-variants" data-shared-variants aria-label="墙体设计预览"></nav>
    <main class="preview-main">
      <section class="wall-intro" aria-label="墙体章节简介">
        <div class="intro-copy" data-shared-intro></div>
        <figure class="hero-art" aria-labelledby="lines-art-caption">
          <div class="drawing-label" aria-hidden="true"><span>构造语言</span><span>线与接缝</span></div>
          <img class="wall-line-drawing" src="./lines-art.svg" alt="由蓝色折面、平行细线与留白接缝组成的抽象墙体图解，呈现承重、围护和分隔三种作用。" width="760" height="400" />
          <figcaption id="lines-art-caption"><span>从一条线，读懂一面墙</span><span class="art-caption-detail">抽象构造示意</span></figcaption>
        </figure>
      </section>
      <section class="chapters-section" aria-labelledby="chapters-heading">
        <div class="chapters-top" data-shared-section></div>
        <div class="chapter-list" data-shared-chapters></div>
        <div class="chapter-note" data-shared-note></div>
      </section>
    </main>
  </body>
</html>
