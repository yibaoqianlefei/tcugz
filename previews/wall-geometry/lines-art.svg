<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" fill="none">
  <title>线与接缝</title>
  <desc>抽象墙体由错位的平行面、折角和接缝组成。蓝色折面与细线分别标记承重、围护和分隔。</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <path d="M0 0V8" stroke="#d4d7d1" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- The pale surface and fine frame establish the outer wall boundary. -->
  <path d="M134 137 345 76v227l-211 61Z" fill="#e8eae4"/>
  <path d="M134 137 345 76v227l-211 61Z" fill="url(#hatch)" opacity=".5"/>
  <path d="m134 137 197-57m14 3v98m0 13v109l-211 61V252m0-14V137" stroke="#7f8a99" stroke-width="1.2"/>
  <path d="m120 123 211-61m14 4v32M120 123v227m0 14 211-61" stroke="#b3b9bd" stroke-width=".8"/>

  <!-- A folded blue plane carries the central composition. -->
  <path d="m275 116 24-7v211l-24 7Z" fill="#43558e"/>
  <path d="m275 116 178 48 24-7-178-48Z" fill="#6b7eaf"/>
  <path d="m453 164 24-7v79l-24 7Z" fill="#354674"/>
  <path d="m299 130 154 41v63l-154-41Z" fill="#43558e"/>
  <path d="m299 207 154 41v62l-154-41Z" fill="#43558e"/>
  <path d="m453 248 24-7v81l-24 7Z" fill="#354674"/>
  <path d="m299 288 154 41 24-7-178-48Z" fill="#6b7eaf"/>
  <path d="m299 320 154 41v-32l-154-41Z" fill="#43558e"/>
  <path d="m453 329 24-7v32l-24 7Z" fill="#354674"/>

  <!-- Deliberate gaps let one horizontal joint travel across the planes. -->
  <path d="m120 229 155-45m24 7 137 37m41 11 70-20" stroke="#27344d" stroke-width="1.1"/>
  <path d="m135 243 129-37m35 0 137 37m41 11 70-20" stroke="#a4acb5" stroke-width=".8"/>
  <path d="m268 183 10 3m19 5 9 2m135 34 10 3m20 5 10 3" stroke="#f8f8f5" stroke-width="4"/>

  <!-- Two aligned thin planes describe an internal spatial boundary. -->
  <path d="m430 106 147-43v219l-82 24m-15 4-50 14V257m0-14V106" stroke="#43558e" stroke-width="1.3"/>
  <path d="m447 91 147-43v219l-84 24m-14 4-49 14V249m0-14V91" stroke="#a4acb5" stroke-width=".9"/>
  <path d="m577 63 17-15M577 282l17-15m-147-176-17 15" stroke="#a4acb5" stroke-width=".9"/>
  <path d="m527 78 50-15v219l-50 15Z" fill="#d6c8ad" fill-opacity=".24"/>

  <!-- Leaders and labels describe roles, without asserting technical dimensions. -->
  <g stroke="#929ba7" stroke-width=".9">
    <path d="M67 163h34l33 16"/>
    <path d="M301 54v28l20 28"/>
    <path d="M636 156h-36l-23 16"/>
  </g>
  <g fill="#43558e">
    <circle cx="134" cy="179" r="2.5"/>
    <circle cx="321" cy="110" r="2.5"/>
    <circle cx="577" cy="172" r="2.5"/>
  </g>
  <g fill="#43558e" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" letter-spacing="3">
    <text x="52" y="154">围护</text>
    <text x="278" y="41">承重</text>
    <text x="631" y="147">分隔</text>
  </g>

  <!-- Small registration marks share the same alignment as the composition. -->
  <g stroke="#b7bcbf" stroke-width=".8">
    <path d="M88 346v14H74M614 51V37h14"/>
    <path d="M660 311h12m-6-6v12"/>
  </g>
</svg>
