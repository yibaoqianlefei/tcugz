<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#43558e" />
    <title>墙体 · 构造模块</title>
    <link rel="stylesheet" href="./shared.css" />
    <link rel="stylesheet" href="./modules.css" />
    <script type="module" src="./shared.js"></script>
  </head>
  <body class="variant-modules" data-variant="modules">
    <header class="preview-topbar" data-shared-header></header>
    <nav class="preview-variants" data-shared-variants aria-label="墙体设计预览"></nav>
    <main class="preview-main">
      <section class="wall-intro" aria-labelledby="wall-heading">
        <div class="intro-copy" data-shared-intro></div>

          <div class="module-art-topline" aria-hidden="true">
            <span>WALL / ASSEMBLY</span>

            <img src="../../images/wall/chapter-cover.webp" width="611" height="756" alt="本章墙体构造教学模型" />

          </div>
          <figcaption class="module-art-caption">
            <span>构造关系示意</span>
            <span aria-hidden="true">墙 · 柱 · 板</span>
          </figcaption>
        </figure>
      </section>
      <section class="chapters-section" aria-labelledby="chapters-heading">
        <div class="chapters-top" data-shared-section></div>
        <div class="chapter-list" data-shared-chapters></div>
        <div class="chapter-note" data-shared-note></div>
      </section>
    </main>
